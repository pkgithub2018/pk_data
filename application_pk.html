<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Export Application Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 mb-5">
  <h2 class="mb-4">Export Application Form</h2>
  <form>
    <div class="row g-3">
      <!-- 1 -->
      <div class="col-md-6">
        <label for="issuedBy" class="form-label">Issued by</label>
        <select class="form-select" id="issuedBy">
          <option selected disabled>Choose...</option>
          <option>DOA</option>
          <option>PAFO</option>
          <option>Other</option>
        </select>
      </div>
      <!-- 2 -->
      <div class="col-md-6">
        <label for="regNoReceived" class="form-label">Reg. No. (on receipt)</label>
        <input type="text" class="form-control" id="regNoReceived">
      </div>
      <!-- 3 -->
      <div class="col-md-6">
        <label for="docRegNo" class="form-label">Document Reg. No.</label>
        <input type="text" class="form-control" id="docRegNo">
      </div>
      <!-- 4 -->
      <div class="col-md-6">
        <label for="applicantName" class="form-label">Applicant’s Name</label>
        <input type="text" class="form-control" id="applicantName">
      </div>
      <!-- 5 -->
      <div class="col-md-12">
        <label class="form-label">Current Address</label>
        <div class="row g-2">
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="Village">
          </div>
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="House No.">
          </div>
          <div class="col-md-2">
            <input type="text" class="form-control" placeholder="Unit">
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" placeholder="District">
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" placeholder="Province">
          </div>
        </div>
      </div>
      <!-- 6-8 -->
      <div class="col-md-4">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone">
      </div>
      <div class="col-md-4">
        <label for="fax" class="form-label">Fax</label>
        <input type="text" class="form-control" id="fax">
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email">
      </div>
      <!-- 9 -->
      <div class="col-md-12">
        <label for="exportEntity" class="form-label">Export Entity/Company’s Name and Address</label>
        <textarea class="form-control" id="exportEntity" rows="2"></textarea>
      </div>
      <!-- 10 -->
      <div class="col-md-6">
        <label for="exitPoint" class="form-label">Declared Point for Exit</label>
        <input type="text" class="form-control" id="exitPoint">
      </div>
      <!-- 11 -->
      <div class="col-md-6">
        <label for="exportDate" class="form-label">Export Date</label>
        <input type="date" class="form-control" id="exportDate">
      </div>
      <!-- 12 -->
      <div class="col-md-6">
        <label for="importCountry" class="form-label">Import Country</label>
        <input type="text" class="form-control" id="importCountry">
      </div>
      <!-- 13 -->
      <div class="col-md-6">
        <label for="transitPoint" class="form-label">Declared Point for Transit</label>
        <input type="text" class="form-control" id="transitPoint">
      </div>
      <!-- 14 -->
      <div class="col-md-12">
        <label for="importEntity" class="form-label">Import Entity/Company’s Name and Address</label>
        <textarea class="form-control" id="importEntity" rows="2"></textarea>
      </div>
      <!-- 15 -->
      <div class="col-md-6">
        <label for="entryPoint" class="form-label">Declared Point for Entry</label>
        <input type="text" class="form-control" id="entryPoint">
      </div>
      <!-- 16 -->
      <div class="col-md-6">
        <label for="conveyance" class="form-label">Declared Means of Conveyance</label>
        <select class="form-select" id="conveyance">
          <option disabled selected>Choose...</option>
          <option>Road</option>
          <option>Sea</option>
          <option>Air</option>
          <option>Rail</option>
          <option>Mail</option>
          <option>Passenger</option>
        </select>
      </div>
      <!-- 17 -->
      <div class="col-md-12">
        <label for="treatment" class="form-label">Treatment Method</label>
        <select class="form-select" id="treatment">
          <option disabled selected>Choose...</option>
          <option>Chemical</option>
          <option>Vapour Heat</option>
          <option>Cold Treatment</option>
          <option>Irradiation</option>
          <option>Other (Specify...)</option>
        </select>
      </div>
      <!-- 18 -->
      <div class="col-md-12">
        <label for="exportPurpose" class="form-label">Purpose of Export</label>
        <select class="form-select" id="exportPurpose">
          <option disabled selected>Choose...</option>
          <option>Trade</option>
          <option>Consumption</option>
          <option>Processing</option>
          <option>Factory</option>
          <option>Sample/Exhibition</option>
          <option>Research/Laboratory Testing</option>
        </select>
      </div>
      <!-- 19 -->
      <div class="col-md-6">
        <label for="createdDate" class="form-label">Created Date</label>
        <input type="date" class="form-control" id="createdDate">
      </div>
      <!-- 20 -->
      <div class="col-md-6">
        <label for="approvedDate" class="form-label">Approved Date</label>
        <input type="date" class="form-control" id="approvedDate">
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="reset" class="btn btn-secondary ms-2">Reset</button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
